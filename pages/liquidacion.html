<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Liquidación con Fuentes Locales</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
</head>

<body>

    <h2>Generar Liquidación</h2>
    <button id="btnGenerar" onclick="iniciarGeneracionPDF()">Generar PDF</button>

    <script>
        // Verificar que pdfmake cargó desde el CDN
        if (typeof pdfMake === 'undefined') {
            alert('pdfmake no se cargó. Revisa tu conexión a internet.');
        }

        // === 1. LOS PUENTES (FUNCIONES DE CONVERSIÓN) ===

        async function vincularFuenteLocal(nombreVirtual, rutaLocal) {
            const respuesta = await fetch(rutaLocal);
            if (!respuesta.ok) throw new Error(`No se encontró la fuente: ${rutaLocal}`);
            const blob = await respuesta.blob();
            return new Promise((resolve, reject) => {
                const lector = new FileReader();
                lector.onloadend = () => {
                    pdfMake.vfs[nombreVirtual] = lector.result.split(',')[1]; // base64 puro
                    resolve();
                };
                lector.onerror = reject;
                lector.readAsDataURL(blob);
            });
        }

        async function convertirImagenABase64(rutaLocal) {
            const respuesta = await fetch(rutaLocal);
            if (!respuesta.ok) throw new Error(`No se encontró la imagen: ${rutaLocal}`);
            const blob = await respuesta.blob();
            return new Promise((resolve, reject) => {
                const lector = new FileReader();
                lector.onloadend = () => resolve(lector.result); // DataURL completo (data:image/...)
                lector.onerror = reject;
                lector.readAsDataURL(blob);
            });
        }

        // === 2. EL ORQUESTADOR PRINCIPAL ===
        async function iniciarGeneracionPDF() {
            const btn = document.getElementById('btnGenerar');
            btn.disabled = true;
            btn.textContent = 'Generando...';

            try {
                pdfMake.vfs = pdfMake.vfs || {};

                await vincularFuenteLocal('PinyonScript-Regular.ttf', '../fonts/PinyonScript-Regular.ttf');
                await vincularFuenteLocal('TimesNewRoman-Regular.ttf', '../fonts/times.ttf');
                const imagenBase64 = await convertirImagenABase64('../img/meducacion.jpeg');

                generarPDF(imagenBase64);

            } catch (error) {
                console.error(error);
                alert('Error al preparar el PDF: ' + error.message + '\n\n' +
                    'Causas posibles:\n' +
                    '1. Abriste el HTML con doble clic (file://). Debes usar un servidor local.\n' +
                    '2. Las rutas ../fonts/ o ../img/ no coinciden con tus carpetas.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generar PDF';
            }
        }

        // === 3. DISEÑO Y CONSTRUCCIÓN DEL PDF ===
        function generarPDF(imagenBase64) {
            pdfMake.fonts = {
                Roboto: {
                    normal: 'Roboto-Regular.ttf',
                    bold: 'Roboto-Medium.ttf',
                    italics: 'Roboto-Italic.ttf',
                    bolditalics: 'Roboto-MediumItalic.ttf'
                },
                TimesNewRoman: {
                    normal: 'TimesNewRoman-Regular.ttf',
                    bold: 'TimesNewRoman-Regular.ttf',
                    italics: 'TimesNewRoman-Regular.ttf',
                    bolditalics: 'TimesNewRoman-Regular.ttf'
                },
                PinyonScript: {
                    normal: 'PinyonScript-Regular.ttf',
                    bold: 'PinyonScript-Regular.ttf',
                    italics: 'PinyonScript-Regular.ttf',
                    bolditalics: 'PinyonScript-Regular.ttf'
                }
            };

            const docDefinition = {
                pageMargins: [60, 80, 60, 60],
                pageSize: 'LETTER',
                header: {
    table: {
        widths: ['auto', '*'], // Mantienes las 2 columnas: Logo e Información
        body: [
            [
                // COLUMNA 1: Tu logo (Sin usar rowSpan que rompe el header)
                imagenBase64
                    ? { image: imagenBase64, width: 125, margin: [15, 10, 0, 0] }
                    : { text: '[Sin logo]', margin: [15, 15, 0, 0] },

                // COLUMNA 2: Usamos un bloque contenedor para manejar el espacio vertical libremente
                {
                    stack: [
                        // Renglón vacío superior (Equivale a tu fila anterior)
                        { text: '', height: 10 }, 
                        { text: '', height: 10 }, 
                        
                        // Tu texto oficial que ahora sí se va a renderizar al 100%
                        {
                            text: '\nDirección Departamental de Educación Chalatenango',
                            font: 'PinyonScript',
                            fontSize: 22,
                            margin: [10, 15, 0, 0] // Ajusta el segundo número para bajar o subir el texto respecto al logo
                        }
                    ]
                },
            ]
        ]
    },
    layout: 'noBorders' // Quita los bordes para mantener la estética limpia
},


                content: [
                    { text: 'FORMULARIO DE AUTOLIQUIDACIÓN DE FONDOS TRANSFERIDOS POR EL MINED', fontSize: 11, decoration: 'underline',
                        bold: true, margin: [0,0,0,3],
                    },
                    {
                        text: 'PRESUPUESTO ESCOLAR', fontSize: 11, BOLD: true,margin: [0,0,0,3],
                    },
                    {
                        text: 'Rubro: ___________________________________________________________ Año:___________'
                    },

                ],
                defaultStyle: {
                    
                }
            };

            pdfMake.createPdf(docDefinition).download('liquidacion_local.pdf');
        }
    </script>
</body>

</html>
